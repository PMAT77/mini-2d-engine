<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Mini 2D Engine (Canvas)</title>
    <link rel="stylesheet" href="/src/ui/PlayerDebugPanel.css" />
    <link rel="stylesheet" href="/src/ui/BackpackPanel.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #111;
        overflow: hidden;
      }
      canvas {
        background: #fff;
        border: 2px solid #333;
      }
      /* 瞄准时隐藏系统指针，画面只留准星；常态及操作面板显示系统指针。 */
      body.crosshair-active,
      body.crosshair-active canvas {
        cursor: none;
      }
      /* 暂停和模态面板显示系统鼠标。 */
      body.cursor-visible,
      body.cursor-visible canvas {
        cursor: default !important;
      }
      body.crosshair-active .player-debug button {
        cursor: pointer;
      }
      body.crosshair-active .player-debug .debug-modal,
      body.crosshair-active .player-debug .debug-overlay,
      body.crosshair-active .player-debug input,
      body.crosshair-active .player-debug select {
        cursor: auto;
      }
    </style>
  </head>
  <body>
    <canvas width="800" height="450"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
