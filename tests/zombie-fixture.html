<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/ui/PlayerDebugPanel.css">
<style>html,body{margin:0;overflow:hidden;background:#101615}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="game"></canvas>
<script type="module">
import { Game } from '/src/core/Game.ts';
import { GameScene } from '/src/scenes/GameScene.ts';
import { TileMap } from '/src/map/TileMap.ts';
const game = new Game(document.querySelector('canvas'));
const params = new URLSearchParams(location.search), seed = Number(params.get('seed') ?? 424242);
const map = new TileMap(40, 30, { seed, generateWater: false });
map.tiles.forEach(row => row.fill('default'));
for(let row=5;row<20;row++) map.tiles[row][22] = 'wall';
map.invalidateNavigation();
const count = params.has('count') ? Number(params.get('count')) : 4;
const scene = new GameScene({ map, seed, playerSpawn: { x: 775.5, y: 725.5 }, encounters: { shambler: Math.ceil(count/2), runner: Math.floor(count/2), vaccines: 2 } });
await scene.load(); game.sceneManager.changeScene(scene, 0);
await new Promise(requestAnimationFrame);
const tick = (steps = 1, dt = 1/60) => { for(let i=0;i<steps;i++) game.sceneManager.update(dt, game.input); game.sceneManager.draw(game.renderer.ctx); };
tick();
window.fixture = { game, scene, map, tick, addEnemy: (kind, x, y, facing=0) => scene.getEnemySystem().add(kind, {x,y}, facing) };
</script></body></html>
